syntax = "proto3";
package bench.protobuf;
option go_package = "example.com/bench/protobuf";

message StringMessage {
  uint32 sequence = 1;
  string name = 2;
  string text = 3;
  string details = 4;
}

message Scalars {
  uint32 sequence = 1;
  sint32 delta = 2;
  fixed32 checksum = 3;
  float x = 4;
  float y = 5;
  float z = 6;
  float vx = 7;
  float vy = 8;
  float vz = 9;
  double precision = 10;
  bool active = 11;
  uint32 kind = 12;
}
message Vec3 { float x = 1; float y = 2; float z = 3; }
message State {
  Vec3 position = 1;
  Vec3 velocity = 2;
  Vec3 facing = 3;
  sint32 delta = 4;
  fixed32 checksum = 5;
  double precision = 6;
  bool active = 7;
  uint32 kind = 8;
}
message Inline { uint32 sequence = 1; State state = 2; }
message Node { uint32 sequence = 1; float x = 2; float y = 3; Node next = 4; }
